<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>สรุป SI — ยอดโหลดสินค้าส่งจริง</title>
<!--
  ══════════════════════════════════════════════════════════════════════
   หน้า "สรุป SI" แบบอ่านอย่างเดียว สำหรับให้ระบบอื่น (ฝ่ายขาย) ฝัง iframe
   - ไม่มี login  ป้องกันด้วย token ใน query string (?k=...)
   - ไม่แตะ Supabase โดยตรง และไม่มี anon key อยู่ในไฟล์นี้
     ดึงข้อมูลผ่าน Edge Function si-summary ซึ่งใช้ service_role ฝั่ง server
   - อ่านอย่างเดียวจริง: ไม่มีปุ่มบันทึก/อนุมัติ/แก้ไข Edge Function รับแต่ GET
   ฝัง:
     <iframe src="https://wh-tst.github.io/Warehouse-Logistic-TST/si-view.html?k=TOKEN"
             style="width:100%;height:900px;border:0"></iframe>
  ══════════════════════════════════════════════════════════════════════
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: 'Sarabun', -apple-system, 'Segoe UI', sans-serif; background:#f8fafc; }
</style>
</head>
<body class="p-4">

<div class="max-w-full space-y-4">

  <!-- หัวเรื่อง -->
  <div class="flex items-center justify-between flex-wrap gap-2">
    <div>
      <h1 class="text-xl font-black text-slate-800">สรุป SI — ยอดโหลดสินค้าส่งจริง</h1>
      <p class="text-xs font-bold text-slate-400">ข้อมูลสดจากระบบ WMS · อ่านอย่างเดียว</p>
    </div>
    <span class="text-[11px] font-black px-3 py-1.5 rounded-full bg-slate-200 text-slate-600">
      <i class="fas fa-lock"></i> READ ONLY
    </span>
  </div>

  <!-- แถบกรอง -->
  <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap items-end gap-3">
    <div>
      <label class="block text-xs font-black text-slate-500 mb-1">วันที่ (ช่วง)</label>
      <div class="flex items-center gap-2">
        <input type="date" id="si-date-from" onchange="siLoad()"
               class="border-2 border-slate-200 rounded-xl px-3 py-2 text-sm font-bold focus:border-indigo-400 focus:outline-none">
        <span class="text-slate-400">–</span>
        <input type="date" id="si-date-to" onchange="siLoad()"
               class="border-2 border-slate-200 rounded-xl px-3 py-2 text-sm font-bold focus:border-indigo-400 focus:outline-none">
      </div>
    </div>
    <div>
      <label class="block text-xs font-black text-slate-500 mb-1">ทีมโหลด</label>
      <select id="si-f-team" onchange="siRender()"
              class="border-2 border-slate-200 rounded-xl px-3 py-2 text-sm font-bold focus:border-indigo-400 focus:outline-none bg-white">
        <option value="">ทุกทีม</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-black text-slate-500 mb-1">ประเภทรถ</label>
      <select id="si-f-truck" onchange="siRender()"
              class="border-2 border-slate-200 rounded-xl px-3 py-2 text-sm font-bold focus:border-indigo-400 focus:outline-none bg-white">
        <option value="">ทุกประเภท</option>
        <option value="company">รถบริษัท</option>
        <option value="hired">รถจ้าง</option>
        <option value="self">รถรับเอง</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-black text-slate-500 mb-1">อยู่ในเกณฑ์น้ำหนัก</label>
      <select id="si-f-range" onchange="siRender()"
              class="border-2 border-slate-200 rounded-xl px-3 py-2 text-sm font-bold focus:border-indigo-400 focus:outline-none bg-white">
        <option value="">ทั้งหมด</option>
        <option value="ok">อยู่ในเกณฑ์</option>
        <option value="out">นอกเกณฑ์</option>
      </select>
    </div>
    <div class="flex-1 min-w-[200px]">
      <label class="block text-xs font-black text-slate-500 mb-1">ค้นหา ลูกค้า / SKU / ชื่อสินค้า</label>
      <input type="text" id="si-f-search" oninput="siRender()" placeholder="พิมพ์เพื่อค้นหา..."
             class="w-full border-2 border-slate-200 rounded-xl px-3 py-2 text-sm font-bold focus:border-indigo-400 focus:outline-none">
    </div>
    <button onclick="siExport()"
            class="px-4 py-2.5 border-2 border-slate-200 bg-white text-slate-600 font-black text-sm rounded-xl hover:bg-slate-50 transition">
      Export Excel
    </button>
    <button onclick="siLoad()"
            class="px-4 py-2.5 bg-indigo-600 text-white font-black text-sm rounded-xl hover:bg-indigo-700 transition">
      รีเฟรช
    </button>
  </div>

  <!-- KPI -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="si-kpi"></div>

  <!-- ตาราง -->
  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
      <div class="text-sm font-black text-slate-700">พบ <span id="si-count" class="text-indigo-600">0</span> รายการ</div>
      <div class="flex items-center gap-3">
        <button onclick="siClearSortFilter()" id="si-clear-btn"
                class="px-3 py-1.5 text-xs font-black rounded-lg border-2 border-slate-200 text-slate-500 hover:bg-slate-50 transition hidden">✕ ล้างค่า Sort / Filter</button>
        <div class="text-xs font-bold text-slate-400" id="si-updated"></div>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm" style="min-width:1480px;">
        <thead id="si-thead" class="bg-slate-50 border-b border-slate-200"></thead>
        <tbody id="si-tbody">
          <tr><td colspan="13" class="text-center py-16 text-slate-400 font-bold">กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
// ══ ตั้งค่า ═══════════════════════════════════════════════════════════
var SI_API = 'https://akazjfgbnzhykhgeenye.supabase.co/functions/v1/si-summary';
var SI_TOKEN = new URLSearchParams(location.search).get('k') || '';

var _siRows = [];

function _esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// "วันนี้" ตามเวลาไทย — ห้ามใช้ toISOString() นั่นคือวัน UTC ตี 0-7 โมงจะเพี้ยนเป็นเมื่อวาน
function _bkkToday(){
  return new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Bangkok' }).slice(0,10);
}

function _fatal(msg){
  document.getElementById('si-tbody').innerHTML =
    '<tr><td colspan="13" class="text-center py-16 text-rose-500 font-bold">' + _esc(msg) + '</td></tr>';
  document.getElementById('si-kpi').innerHTML = '';
  document.getElementById('si-count').textContent = '0';
}

window.siLoad = async function(){
  if (!SI_TOKEN) { _fatal('ไม่พบ token — URL ต้องมี ?k=<token> ติดต่อทีม WMS เพื่อขอใบอนุญาต'); return; }

  var fromV = document.getElementById('si-date-from').value;
  var toV   = document.getElementById('si-date-to').value;
  if (!fromV || !toV) return;

  document.getElementById('si-tbody').innerHTML =
    '<tr><td colspan="13" class="text-center py-16 text-slate-400 font-bold">กำลังโหลด...</td></tr>';

  try {
    var qs = new URLSearchParams({ from: fromV, to: toV, k: SI_TOKEN });
    var res = await fetch(SI_API + '?' + qs.toString());
    var j = await res.json();
    if (!res.ok) { _fatal(j.error || ('เกิดข้อผิดพลาด (' + res.status + ')')); return; }

    _siRows = j.rows || [];

    // เติม dropdown ทีมโหลดจากข้อมูลจริง
    var teams = Array.from(new Set(_siRows.map(function(r){ return r.team; }).filter(Boolean))).sort();
    var sel = document.getElementById('si-f-team'), cur = sel.value;
    sel.innerHTML = '<option value="">ทุกทีม</option>' +
      teams.map(function(t){ return '<option value="' + _esc(t) + '">' + _esc(t) + '</option>'; }).join('');
    sel.value = cur;

    document.getElementById('si-updated').textContent =
      'อัปเดตเมื่อ ' + new Date().toLocaleTimeString('th-TH', { timeZone:'Asia/Bangkok', hour:'2-digit', minute:'2-digit' });

    siRender();
  } catch(e) {
    _fatal('เชื่อมต่อไม่ได้: ' + (e && e.message ? e.message : String(e)));
  }
};


// ══ Sort / Filter รายคอลัมน์ ═════════════════════════════════════════════
var SI_TRUCK_LABEL = { company:'รถบริษัท', hired:'รถจ้าง', self:'รถรับเอง' };
var SI_RANGE_LABEL = { ok:'ในเกณฑ์', over:'เกิน Max', under:'ต่ำกว่า Min' };

var SI_COLS = [
  { k:'date',        label:'วันที่',             align:'left',   f:'select' },
  { k:'time',        label:'เวลาโหลดเสร็จ',       align:'left',   f:'text'   },
  { k:'customer',    label:'ลูกค้า',             align:'left',   f:'select' },
  { k:'sale',        label:'Sale',              align:'left',   f:'select' },
  { k:'sku',         label:'รหัสสินค้า',          align:'left',   f:'text'   },
  { k:'name',        label:'ชื่อสินค้า',          align:'left',   f:'text'   },
  { k:'qty',         label:'จำนวนโหลดจริง',       align:'right',  f:'num', num:true },
  { k:'finalKg',     label:'น้ำหนัก Final (กก.)', align:'right',  f:'num', num:true },
  { k:'perUnit',     label:'กก./เส้น',           align:'right',  f:'num', num:true },
  { k:'rangeStatus', label:'อยู่ในเกณฑ์',         align:'center', f:'select', map:SI_RANGE_LABEL },
  { k:'team',        label:'ทีมโหลด',            align:'left',   f:'select' },
  { k:'truckType',   label:'ประเภทรถ',           align:'center', f:'select', map:SI_TRUCK_LABEL },
  { k:'truckLabel',  label:'ทะเบียน / ชื่อขนส่ง', align:'left',   f:'text'   }
];

var _siSort = { k:'', dir:0 };
// _siColF[key] = { vals:[...] }  สำหรับคอลัมน์ทั่วไป (ว่าง/ไม่มี = ไม่กรอง)
//              = { min:n, max:n } สำหรับคอลัมน์ตัวเลข
var _siColF = {};
var _siMenuKey = '';     // คอลัมน์ที่เปิดป๊อบอัพอยู่
var _siMenuQ = '';       // คำค้นในรายการของป๊อบอัพ

function _siColOf(k){ return SI_COLS.filter(function(c){ return c.k === k; })[0] || {}; }
function _siHasF(k){
  var f = _siColF[k];
  if (!f) return false;
  if (f.vals) return f.vals.length > 0;
  return f.min != null || f.max != null;
}
function _siAnyF(){ return SI_COLS.some(function(c){ return _siHasF(c.k); }); }

// ค่าที่เลือกได้ของคอลัมน์ — คิดจากข้อมูลที่ผ่านตัวกรองคอลัมน์ "อื่น" แล้ว
// (เหมือน Excel: เปิดเมนูคอลัมน์ไหน จะเห็นเฉพาะค่าที่ยังเป็นไปได้)
function _siValuesFor(key){
  var rows = _siRows.filter(function(r){ return _siMatchExcept(r, key); });
  var c = _siColOf(key);
  var seen = {}, out = [];
  rows.forEach(function(r){
    var v = r[key];
    if (v == null || v === '') return;
    v = String(v);
    if (!seen[v]) { seen[v] = 1; out.push({ v:v, label: c.map ? (c.map[v] || v) : v }); }
  });
  out.sort(function(a,b){ return a.label.localeCompare(b.label, 'th'); });
  return out;
}

function _siMatchExcept(r, skipKey){
  for (var i = 0; i < SI_COLS.length; i++) {
    var c = SI_COLS[i];
    if (c.k === skipKey) continue;
    var f = _siColF[c.k];
    if (!f) continue;
    if (c.num) {
      var n = parseFloat(r[c.k]) || 0;
      if (f.min != null && n < f.min) return false;
      if (f.max != null && n > f.max) return false;
    } else if (f.vals && f.vals.length) {
      if (f.vals.indexOf(String(r[c.k])) < 0) return false;
    }
  }
  return true;
}

// ── ป๊อบอัพต่อคอลัมน์ ────────────────────────────────────────────────────
window.siToggleMenu = function(key, ev){
  ev.stopPropagation();
  if (_siMenuKey === key) { siCloseMenu(); return; }
  _siMenuKey = key;
  _siMenuQ = '';
  _siDrawMenu(ev.currentTarget);
};

function _siMenuEl(){
  var m = document.getElementById('si-menu');
  if (!m) {
    m = document.createElement('div');
    m.id = 'si-menu';
    m.className = 'hidden absolute z-50 w-64 bg-white rounded-xl border border-slate-200 shadow-xl py-1';
    document.body.appendChild(m);
  }
  return m;
}

window.siCloseMenu = function(){
  _siMenuKey = '';
  _siMenuEl().classList.add('hidden');
};

function _siDrawMenu(anchorEl){
  var m = _siMenuEl();
  var key = _siMenuKey, c = _siColOf(key);
  var f = _siColF[key] || {};
  var sortedAsc  = _siSort.k === key && _siSort.dir === 1;
  var sortedDesc = _siSort.k === key && _siSort.dir === -1;

  function btn(active, onclick, icon, text){
    return '<button onclick="' + onclick + '" class="w-full flex items-center gap-2 px-3 py-2 text-xs font-bold rounded-lg transition '
         + (active ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:bg-slate-100') + '">'
         + '<span class="w-4 text-center">' + icon + '</span>' + text + '</button>';
  }

  var html = '<div class="px-3 pt-3 pb-1 text-[11px] font-black text-slate-400 uppercase">' + _esc(c.label) + '</div>'
    + '<div class="px-1.5">'
    +   btn(sortedAsc,  'siSetSort(\'' + key + '\',1)',  '↑', c.num ? 'น้อย → มาก' : 'ก → ฮ / A → Z')
    +   btn(sortedDesc, 'siSetSort(\'' + key + '\',-1)', '↓', c.num ? 'มาก → น้อย' : 'ฮ → ก / Z → A')
    +   (_siSort.k === key ? btn(false, 'siSetSort(\'' + key + '\',0)', '✕', 'ยกเลิกการเรียง') : '')
    + '</div><div class="border-t border-slate-100 my-1.5"></div>';

  if (c.num) {
    html += '<div class="px-3 pb-1 text-[11px] font-black text-slate-400 uppercase">ช่วงตัวเลข</div>'
      + '<div class="px-3 pb-2 flex items-center gap-2">'
      +   '<input id="si-menu-min" type="number" step="any" placeholder="ตั้งแต่" value="' + (f.min != null ? f.min : '') + '" '
      +     'class="w-full border-2 border-slate-200 rounded-lg px-2 py-1.5 text-xs font-bold focus:border-indigo-400 focus:outline-none">'
      +   '<span class="text-slate-300">–</span>'
      +   '<input id="si-menu-max" type="number" step="any" placeholder="ถึง" value="' + (f.max != null ? f.max : '') + '" '
      +     'class="w-full border-2 border-slate-200 rounded-lg px-2 py-1.5 text-xs font-bold focus:border-indigo-400 focus:outline-none">'
      + '</div>';
  } else {
    var all = _siValuesFor(key);
    var q = _siMenuQ.toLowerCase();
    var shown = q ? all.filter(function(o){ return o.label.toLowerCase().indexOf(q) >= 0; }) : all;
    var sel = f.vals || [];
    var allChecked = shown.length > 0 && shown.every(function(o){ return sel.indexOf(o.v) >= 0; });

    html += '<div class="px-3 pb-2">'
      + '<input id="si-menu-q" type="text" placeholder="ค้นหาในรายการ..." value="' + _esc(_siMenuQ) + '" '
      +   'oninput="siMenuSearch(this.value)" '
      +   'class="w-full border-2 border-slate-200 rounded-lg px-2 py-1.5 text-xs font-bold focus:border-indigo-400 focus:outline-none">'
      + '</div>'
      + '<div class="max-h-56 overflow-y-auto px-1.5">'
      + '<label class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer border-b border-slate-100 mb-1">'
      +   '<input type="checkbox" onchange="siMenuAll(this.checked)"' + (allChecked ? ' checked' : '')
      +     ' class="accent-indigo-600 w-3.5 h-3.5">'
      +   '<span class="text-xs font-black text-slate-600">เลือกทั้งหมด</span></label>';

    if (!shown.length) html += '<div class="px-2 py-6 text-center text-xs font-bold text-slate-300">ไม่พบ</div>';
    shown.forEach(function(o){
      html += '<label class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">'
        + '<input type="checkbox" onchange="siMenuPick(\'' + encodeURIComponent(o.v) + '\', this.checked)"'
        + (sel.indexOf(o.v) >= 0 ? ' checked' : '') + ' class="accent-indigo-600 w-3.5 h-3.5">'
        + '<span class="text-xs font-bold text-slate-600 truncate" title="' + _esc(o.label) + '">' + _esc(o.label) + '</span></label>';
    });
    html += '</div>';
  }

  html += '<div class="border-t border-slate-100 mt-1.5 px-3 py-2 flex items-center gap-2">'
    + '<button onclick="siClearCol(\'' + key + '\')" class="flex-1 px-2 py-1.5 text-xs font-black rounded-lg border-2 border-slate-200 text-slate-500 hover:bg-slate-50">ล้างคอลัมน์นี้</button>'
    + (c.num ? '<button onclick="siApplyNum(\'' + key + '\')" class="flex-1 px-2 py-1.5 text-xs font-black rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">ตกลง</button>'
             : '<button onclick="siCloseMenu()" class="flex-1 px-2 py-1.5 text-xs font-black rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">เสร็จ</button>')
    + '</div>';

  m.innerHTML = html;
  m.classList.remove('hidden');

  // วางใต้ไอคอน และดันกลับเข้าจอถ้าล้นขอบขวา
  var r = anchorEl.getBoundingClientRect();
  m.style.top  = (r.bottom + window.scrollY + 6) + 'px';
  var left = r.left + window.scrollX;
  m.style.left = Math.max(8, Math.min(left, window.scrollX + document.documentElement.clientWidth - m.offsetWidth - 8)) + 'px';

  var qEl = document.getElementById('si-menu-q');
  if (qEl && _siMenuQ) { qEl.focus(); qEl.setSelectionRange(qEl.value.length, qEl.value.length); }
}

function _siRedrawMenu(){
  if (!_siMenuKey) return;
  var icon = document.querySelector('#si-thead [data-fkey="' + _siMenuKey + '"]');
  if (icon) _siDrawMenu(icon);
}

window.siMenuSearch = function(v){ _siMenuQ = v; _siRedrawMenu(); };

window.siMenuPick = function(encV, on){
  var v = decodeURIComponent(encV);
  var f = _siColF[_siMenuKey] || { vals: [] };
  var sel = (f.vals || []).slice();
  var i = sel.indexOf(v);
  if (on && i < 0) sel.push(v);
  if (!on && i >= 0) sel.splice(i, 1);
  if (sel.length) _siColF[_siMenuKey] = { vals: sel }; else delete _siColF[_siMenuKey];
  siRender();
  _siRedrawMenu();
};

window.siMenuAll = function(on){
  if (on) {
    var q = _siMenuQ.toLowerCase();
    var shown = _siValuesFor(_siMenuKey).filter(function(o){ return !q || o.label.toLowerCase().indexOf(q) >= 0; });
    _siColF[_siMenuKey] = { vals: shown.map(function(o){ return o.v; }) };
  } else {
    delete _siColF[_siMenuKey];
  }
  siRender();
  _siRedrawMenu();
};

window.siApplyNum = function(key){
  var mn = document.getElementById('si-menu-min').value;
  var mx = document.getElementById('si-menu-max').value;
  var f = {};
  if (mn !== '') f.min = parseFloat(mn);
  if (mx !== '') f.max = parseFloat(mx);
  if (f.min != null || f.max != null) _siColF[key] = f; else delete _siColF[key];
  siCloseMenu();
  siRender();
};

window.siClearCol = function(key){
  delete _siColF[key];
  if (_siSort.k === key) _siSort = { k:'', dir:0 };
  siCloseMenu();
  siRender();
};

window.siSetSort = function(key, dir){
  _siSort = dir ? { k:key, dir:dir } : { k:'', dir:0 };
  siCloseMenu();
  siRender();
};

window.siClearSortFilter = function(){
  _siSort = { k:'', dir:0 };
  _siColF = {};
  siCloseMenu();
  ['si-f-team','si-f-truck','si-f-range','si-f-search'].forEach(function(id){
    var el = document.getElementById(id); if (el) el.value = '';
  });
  siRender();
};

// ปิดป๊อบอัพเมื่อคลิกที่อื่น หรือกด Esc
document.addEventListener('click', function(e){
  if (!_siMenuKey) return;
  var m = document.getElementById('si-menu');
  if (m && m.contains(e.target)) return;
  siCloseMenu();
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') siCloseMenu(); });

function _siBuildHead(){
  var thead = document.getElementById('si-thead');
  if (!thead) return;
  var alignCls = { left:'text-left', right:'text-right', center:'text-center' };

  thead.innerHTML = '<tr>' + SI_COLS.map(function(c){
    var sorted = _siSort.k === c.k;
    var active = sorted || _siHasF(c.k);
    var mark = sorted ? (_siSort.dir === 1 ? '↑' : '↓') : '';
    return '<th class="px-3 py-2.5 ' + alignCls[c.align] + ' text-[11px] font-black uppercase whitespace-nowrap '
      + (active ? 'text-indigo-600' : 'text-slate-500') + '">'
      + '<span class="inline-flex items-center gap-1">'
      +   _esc(c.label)
      +   (mark ? '<span class="text-indigo-600">' + mark + '</span>' : '')
      +   '<button type="button" data-fkey="' + c.k + '" onclick="siToggleMenu(\'' + c.k + '\', event)" '
      +     'title="เรียงลำดับ / กรอง" '
      +     'class="w-5 h-5 inline-flex items-center justify-center rounded transition '
      +     (active ? 'bg-indigo-100 text-indigo-600' : 'text-slate-300 hover:bg-slate-200 hover:text-slate-600') + '">'
      +     '<svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" aria-hidden="true">'
      +       '<path d="M1.5 2.5h13a.5.5 0 0 1 .38.82L10 9.2V14a.5.5 0 0 1-.76.43l-2.5-1.5A.5.5 0 0 1 6.5 12.5V9.2L1.12 3.32a.5.5 0 0 1 .38-.82Z"/>'
      +     '</svg></button>'
      + '</span></th>';
  }).join('') + '</tr>';
}

function _siFiltered(){
  var fTeam   = document.getElementById('si-f-team').value;
  var fTruck  = document.getElementById('si-f-truck').value;
  var fRange  = document.getElementById('si-f-range').value;
  var fSearch = document.getElementById('si-f-search').value.toLowerCase().trim();

  var list = _siRows.filter(function(r){
    if (fTeam  && r.team      !== fTeam)  return false;
    if (fTruck && r.truckType !== fTruck) return false;
    if (fRange === 'ok'  && r.rangeStatus !== 'ok') return false;
    if (fRange === 'out' && r.rangeStatus === 'ok') return false;
    if (fSearch && !((r.customer + ' ' + r.sku + ' ' + r.name).toLowerCase().includes(fSearch))) return false;

    return _siMatchExcept(r, null);
  });

  if (_siSort.dir && _siSort.k) {
    var col = SI_COLS.filter(function(c){ return c.k === _siSort.k; })[0] || {};
    list = list.slice().sort(function(a, b){
      var x = a[_siSort.k], y = b[_siSort.k];
      if (col.num) return ((parseFloat(x) || 0) - (parseFloat(y) || 0)) * _siSort.dir;
      return String(x == null ? '' : x).localeCompare(String(y == null ? '' : y), 'th') * _siSort.dir;
    });
  }
  return list;
}

window.siRender = function(){
  var list = _siFiltered();
  _siBuildHead();

  var clearBtn = document.getElementById('si-clear-btn');
  if (clearBtn) clearBtn.classList.toggle('hidden', !_siSort.dir && !_siAnyF());

  document.getElementById('si-count').textContent = list.length.toLocaleString();

  var totalQty = list.reduce(function(s,r){ return s + r.qty; }, 0);
  var totalKg  = list.reduce(function(s,r){ return s + r.finalKg; }, 0);
  var outCount = list.filter(function(r){ return r.rangeStatus !== 'ok'; }).length;

  function tile(label, value, unit, cls){
    return '<div class="bg-white rounded-2xl border border-slate-200 p-4">'
         +   '<div class="text-[11px] font-black text-slate-400 uppercase mb-1">' + label + '</div>'
         +   '<div class="text-2xl font-black ' + (cls||'text-slate-800') + '">' + value
         +     ' <span class="text-sm text-slate-400 font-bold">' + unit + '</span></div></div>';
  }
  document.getElementById('si-kpi').innerHTML =
      tile('รายการที่โหลด',      list.length.toLocaleString(), 'รายการ')
    + tile('จำนวนโหลดจริงรวม',   totalQty.toLocaleString(),    'เส้น')
    + tile('น้ำหนัก Final รวม',  totalKg.toLocaleString(undefined,{maximumFractionDigits:0}), 'กก.')
    + tile('นอกเกณฑ์น้ำหนัก',    outCount.toLocaleString(),    'รายการ', outCount ? 'text-rose-600' : '');

  var tbody = document.getElementById('si-tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="13" class="text-center py-16 text-slate-400 font-bold">ไม่พบรายการ</td></tr>';
    return;
  }

  var truckBadge = { company:['bg-slate-100 text-slate-700','รถบริษัท'], hired:['bg-sky-100 text-sky-700','รถจ้าง'], self:['bg-violet-100 text-violet-700','รถรับเอง'] };
  var rangeBadge = { ok:['bg-emerald-100 text-emerald-700','ในเกณฑ์'], over:['bg-rose-100 text-rose-700','▲ เกิน Max'], under:['bg-amber-100 text-amber-700','▼ ต่ำกว่า Min'] };
  var n2 = { minimumFractionDigits:2, maximumFractionDigits:2 };

  tbody.innerHTML = list.map(function(r){
    var tb = truckBadge[r.truckType] || truckBadge.self;
    var rb = rangeBadge[r.rangeStatus] || rangeBadge.ok;
    return '<tr class="border-b border-slate-100 hover:bg-slate-50 transition">'
      + '<td class="px-3 py-2.5 font-bold text-slate-700 whitespace-nowrap">' + _esc(r.date) + '</td>'
      + '<td class="px-3 py-2.5 text-xs text-slate-400 font-mono whitespace-nowrap">' + _esc(r.time) + '</td>'
      + '<td class="px-3 py-2.5 font-bold text-slate-700">' + _esc(r.customer) + '</td>'
      + '<td class="px-3 py-2.5 text-slate-500">' + _esc(r.sale) + '</td>'
      + '<td class="px-3 py-2.5 text-slate-500 font-mono whitespace-nowrap">' + _esc(r.sku) + '</td>'
      + '<td class="px-3 py-2.5 font-bold text-slate-700">' + _esc(r.name) + '</td>'
      + '<td class="px-3 py-2.5 text-right font-black text-slate-800">' + r.qty.toLocaleString(undefined, n2) + '</td>'
      + '<td class="px-3 py-2.5 text-right font-black text-slate-800">' + r.finalKg.toLocaleString(undefined, n2) + '</td>'
      + '<td class="px-3 py-2.5 text-right font-bold text-slate-600">' + r.perUnit.toFixed(2) + '</td>'
      + '<td class="px-3 py-2.5 text-center"><span class="inline-block text-[11px] font-black px-2.5 py-1 rounded-full ' + rb[0] + '">' + rb[1] + '</span></td>'
      + '<td class="px-3 py-2.5 text-slate-600 font-bold whitespace-nowrap">' + _esc(r.team) + '</td>'
      + '<td class="px-3 py-2.5 text-center"><span class="inline-block text-[11px] font-black px-2.5 py-1 rounded-full ' + tb[0] + '">' + tb[1] + '</span></td>'
      + '<td class="px-3 py-2.5 text-slate-500 font-mono whitespace-nowrap">' + _esc(r.truckLabel) + '</td>'
      + '</tr>';
  }).join('');
};

window.siExport = function(){
  var head = ['วันที่','เวลาโหลดเสร็จ','ลูกค้า','Sale','รหัสสินค้า','ชื่อสินค้า','จำนวนโหลดจริง','น้ำหนัก Final (กก.)','กก./เส้น','อยู่ในเกณฑ์','ทีมโหลด','ประเภทรถ','ทะเบียน/ชื่อขนส่ง'];
  var truckLabel = SI_TRUCK_LABEL;
  var rangeLabel = SI_RANGE_LABEL;
  var rows = [head];
  _siFiltered().forEach(function(r){
    rows.push([ r.date, r.time, r.customer, r.sale, r.sku, r.name,
                Number(r.qty.toFixed(2)), Number(r.finalKg.toFixed(2)), Number(r.perUnit.toFixed(2)),
                rangeLabel[r.rangeStatus] || '', r.team, truckLabel[r.truckType] || '', r.truckLabel ]);
  });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'สรุป SI');
  XLSX.writeFile(wb, 'SI_' + document.getElementById('si-date-from').value + '_to_' + document.getElementById('si-date-to').value + '.xlsx');
};

// ── เริ่มต้น: ค่าเริ่มต้นเป็นวันนี้ (เวลาไทย) ──────────────────────────────
(function(){
  var t = _bkkToday();
  document.getElementById('si-date-from').value = t;
  document.getElementById('si-date-to').value   = t;
  siLoad();
  // รีเฟรชอัตโนมัติทุก 60 วินาที เพื่อให้ฝ่ายขายเห็นข้อมูลสดโดยไม่ต้องกดเอง
  setInterval(function(){ siLoad(); }, 60000);
})();
</script>
